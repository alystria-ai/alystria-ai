<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#eef1ff"><text x="240" y="275" text-anchor="middle" opacity="0"><tspan fill="#f3b9a6" font-weight="700">YOU</tspan> Think they'll follow us?<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0300;0.1700;0.2000;1.0000" dur="15s" repeatCount="indefinite"/></text><text x="240" y="275" text-anchor="middle" opacity="0"><tspan fill="#f3b9a6" font-weight="700">MIRA</tspan> Let them. I want a rematch.<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0.0000;0.1999;0.2000;0.2300;0.3700;0.4000;1.0000" dur="15s" repeatCount="indefinite"/></text><text x="240" y="275" text-anchor="middle" opacity="0"><tspan fill="#f3b9a6" font-weight="700">MIRA</tspan> You went left. I said right.<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0.0000;0.3999;0.4000;0.4300;0.5700;0.6000;1.0000" dur="15s" repeatCount="indefinite"/></text><text x="240" y="275" text-anchor="middle" opacity="0"><tspan fill="#f3b9a6" font-weight="700">YOU</tspan> …I was flanking.<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0.0000;0.5999;0.6000;0.6300;0.7700;0.8000;1.0000" dur="15s" repeatCount="indefinite"/></text><text x="240" y="275" text-anchor="middle" opacity="0"><tspan fill="#f3b9a6" font-weight="700">MIRA</tspan> Sure you were.<animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0.0000;0.7999;0.8000;0.8300;0.9700;1.0000" dur="15s" repeatCount="indefinite"/></text></g></g>
