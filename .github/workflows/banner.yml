# Refreshes the contribution count badge (assets/badge-contributions.svg).
name: Refresh banner

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/banner.yml"]

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate artwork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/make_assets.py
      - name: Commit if the number changed
        run: |
          if git diff --quiet -- assets; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh contribution count"
          git push
